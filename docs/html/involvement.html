<!DOCTYPE html>

<html>
    <head>

        <title>Get Involved!</title>
        <link rel="stylesheet" href="../css/style.css">
        <meta charset = "UTF-8">
        <meta name = "viewport" content = "width=device-width, initial-scale=1.0">
    </head>
    <body>

        <div id="header"></div>

        <h1>Get Involved</h1>

        <p>Join us in making a difference in our community! There are many ways
             to get involved, from volunteering at local events to participating in our monthly meetings.</p>

        <div id = "involvement-options">
            <button onclick = "openSection('volunteering')"> Become a Volunteer!</button>
            <button onclick = "openSection('branching')"> Start a Branch!</button>

        </div>

        <div class = "involvement-section" id= "volunteering">
            <form id="contact-volunteering">
                <input type="text" name="name" placeholder="Your Name" required>
                <input type="email" name="email" placeholder="Your Email" required>
                <textarea name="message" placeholder="Message" required></textarea>
                <button type="submit">Send</button>
            </form>

        <p id="status"></p>

            
        </div>

        <div class = "involvement-section" id = "branching">


            <form id="contact-branching">
                <input type="text" name="name" placeholder="Your Name" required>
                <input type="email" name="email" placeholder="Your Email" required>
                <textarea name="message" placeholder="Message" required></textarea>
                <button type="submit">Send</button>
            </form>

        <p id="status"></p>

            
        </div>

        <div id="footer"> </div>

        <script src = "../js/script.js"></script>

        <script>
            function openSection(type) {
                let page = document.getElementById(type);
                let doc = document.getElementsByClassName("involvement-section");

                for ( var i = 0; i<doc.length ; i++){
                    doc[i].style.display = "none";
                } 
                page.style.display = "block";

            }

            window.addEventListener("load", () => {
                let doc = document.getElementsByClassName("involvement-section");
                for (var i = 0; i<doc.length; i++){
                    doc[i].style.display = "none";
                }
            });

            emailjs.init("XCxmKyQire0_XaqTy");

            document.getElementById("contact-volunteering").addEventListener("submit", function(e) {
                e.preventDefault();

                emailjs.sendForm(
                    "email",
                    "template_u92hvmf",
                    this
                ).then(() => {
                    document.getElementById("status").textContent = "Message sent!";
                    this.reset();
                }).catch(error => {
                    document.getElementById("status").textContent = "Failed to send.";
                    console.error(error);
                });
            });

            document.getElementById("contact-branching").addEventListener("submit", function(e) {
                e.preventDefault();

                emailjs.sendForm(
                    "email",
                    "template_u92hvmf",
                    this
                ).then(() => {
                    document.getElementById("status").textContent = "Message sent!";
                    this.reset();
                }).catch(error => {
                    document.getElementById("status").textContent = "Failed to send.";
                    console.error(error);
                });
            });
        </script>

    </body>
</html>
